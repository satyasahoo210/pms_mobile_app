query GetProperties {
  properties {
    id
    name
    address
    timezone
    tenantId
    taxPercentage
    logoUrl
    phone
    email
    checkInTime
    checkOutTime
    settings
  }
}

query GetRooms($propertyId: String!) {
  rooms(propertyId: $propertyId) {
    id
    roomNumber
    status
    housekeepingStatus
    priorityCleaning
    RoomType {
      id
      name
      capacity
      defaultPrice
    }
  }
}

query GetBookings($propertyId: String, $guestId: String) {
  bookings(propertyId: $propertyId, guestId: $guestId) {
    id
    guestId
    propertyId
    status
    checkInDate
    checkOutDate
    adults
    children
    discountAmount
    discountType
    totalAmount
    notes
    waiveLastDayCharge
    Guest {
      id
      name
      phone
      email
      address
      gstin
    }
    Payment {
      id
      amount
      method
      status
      createdAt
    }
    BookingRoom {
      id
      roomId
      roomTypeId
      status
      checkInDate
      checkOutDate
      priceOverride
      Room {
        id
        roomNumber
      }
      RoomType {
        id
        name
        defaultPrice
      }
    }
    BookingService {
      id
      bookingId
      serviceId
      quantity
      totalPrice
      Service {
        id
        name
        price
      }
    }
  }
}

query GetUsers {
  users {
    id
    name
    email
    role
  }
}

query GetRecentActivities($propertyId: String!) {
  recentActivities(propertyId: $propertyId) {
    id
    propertyId
    tenantId
    title
    type
    staffName
    createdAt
    updatedAt
  }
}

mutation UpdateRoomStatus($id: ID!, $status: HousekeepingStatus!) {
  updateRoomStatus(id: $id, status: $status) {
    id
    roomNumber
    housekeepingStatus
    status
  }
}

mutation UpdateRoom($id: ID!, $input: UpdateRoomInput!) {
  updateRoom(id: $id, input: $input) {
    id
    roomNumber
    status
    housekeepingStatus
    priorityCleaning
  }
}

query GetGuests {
  guests {
    id
    name
    phone
    email
  }
}

mutation CreateGuest($input: CreateGuestInput!) {
  createGuest(input: $input) {
    id
    name
    phone
    email
  }
}

mutation CreateBooking($input: CreateBookingInput!) {
  createBooking(input: $input) {
    id
    guestId
    propertyId
    status
    checkInDate
    checkOutDate
    adults
    children
    totalAmount
    notes
    waiveLastDayCharge
  }
}

mutation UpdateBooking($id: ID!, $input: UpdateBookingInput!) {
  updateBooking(id: $id, input: $input) {
    id
    guestId
    propertyId
    status
    checkInDate
    checkOutDate
    adults
    children
    totalAmount
    notes
    waiveLastDayCharge
  }
}

mutation CancelBooking($id: ID!) {
  cancelBooking(id: $id) {
    id
    status
  }
}

mutation CreatePayment($input: CreatePaymentInput!) {
  createPayment(input: $input) {
    id
    amount
    method
    status
  }
}

query GetServices($propertyId: String!) {
  services(propertyId: $propertyId) {
    id
    name
    price
    propertyId
    category
  }
}

mutation AddBookingRoom($bookingId: ID!, $roomId: ID, $roomTypeId: ID!, $checkInDate: String, $checkOutDate: String) {
  addBookingRoom(bookingId: $bookingId, roomId: $roomId, roomTypeId: $roomTypeId, checkInDate: $checkInDate, checkOutDate: $checkOutDate) {
    id
    bookingId
    roomTypeId
    roomId
    priceOverride
    status
    checkInDate
    checkOutDate
  }
}

mutation UpdateBookingRoom($id: ID!, $input: UpdateBookingRoomInput!) {
  updateBookingRoom(id: $id, input: $input) {
    id
    roomId
    roomTypeId
    priceOverride
    checkInDate
    checkOutDate
  }
}

mutation DeleteBookingRoom($id: ID!) {
  deleteBookingRoom(id: $id)
}

mutation AddBookingService($bookingId: ID!, $serviceId: ID!, $quantity: Int!, $totalPrice: Float!) {
  addBookingService(bookingId: $bookingId, serviceId: $serviceId, quantity: $quantity, totalPrice: $totalPrice) {
    id
    bookingId
    serviceId
    quantity
    totalPrice
  }
}

mutation UpdateBookingService($id: ID!, $input: UpdateBookingServiceInput!) {
  updateBookingService(id: $id, input: $input) {
    id
    quantity
    totalPrice
  }
}

mutation DeleteBookingService($id: ID!) {
  deleteBookingService(id: $id)
}
